[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", "site/_generated"]

[tool.ruff.lint]
select = ["ANN", "B", "E4", "E7", "E9", "F", "I", "N", "RET"]
ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "E402",
    "N801",
    "N802",
    "N803",
    "N806",
    "N999",
]

[tool.ruff.lint.isort]
known-first-party = ["addons", "blender_addon_suite"]

[tool.basedpyright]
include = ["__init__.py", "addons", "scripts"]
exclude = ["build", "dist", "site/_generated"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportArgumentType = false
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
reportInvalidTypeForm = false
reportMissingImports = false
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportOptionalMemberAccess = false

