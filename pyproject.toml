[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["ANN", "B", "E4", "E7", "E9", "F", "I", "N", "RET"]
ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "E402",
    "N801",
    "N802",
    "N803",
    "N806",
    "N999",
]

[tool.ruff.lint.isort]
known-first-party = ["addons", "blender_addon_suite"]

[tool.basedpyright]
include = ["__init__.py", "addons", "scripts"]
exclude = ["build", "dist"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportArgumentType = false
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
reportInvalidTypeForm = false
reportMissingImports = false
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportOptionalMemberAccess = false
[project]
name = "blender-addons"
version = "0.1.0"
description = "Blender Add-on Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
make-zip = "scripts.make_zip:main"
prepare-release = "scripts.prepare_release:main"
run-docker = "scripts.run_blender_docker:main"
install-blender = "scripts.install_blender:main"
doc-screenshots = "scripts.run_doc_screenshots:main"

