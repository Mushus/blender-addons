name: Deploy Documentation Site to GitHub Pages

# release イベントの workflow 定義は「タグが指すコミット」から読まれる。
# main 上の reusable workflow を直接呼び出し、最新の Node / pnpm
# 設定を使いつつ build / deploy を同じ workflow run で追跡する。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-docs:
    uses: Mushus/blender-addons/.github/workflows/deploy-docs-reusable.yml@main
