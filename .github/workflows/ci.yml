name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: "5.2"
            version: "5.2.0"
          - major: "4.5"
            version: "4.5.0"
          - major: "4.2"
            version: "4.2.3"
    steps:
      - uses: actions/checkout@v7
      - name: Cache Blender archive
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: .blender-cache
          key: blender-${{ matrix.version }}-linux-x64
      - name: Download Blender if cache missed
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p .blender-cache
          curl -fsSL "https://download.blender.org/release/Blender${{ matrix.major }}/blender-${{ matrix.version }}-linux-x64.tar.xz" -o ".blender-cache/blender-${{ matrix.version }}-linux-x64.tar.xz"
      - name: Build Blender Docker image
        run: |
          docker build \
            --build-arg BLENDER_MAJOR=${{ matrix.major }} \
            --build-arg BLENDER_VERSION=${{ matrix.version }} \
            --tag blender-addon-tools:blender-${{ matrix.major }} .
      - name: Run full CI suite in Docker
        run: docker run --rm --volume "${{ github.workspace }}:/workspace" --workdir /workspace blender-addon-tools:blender-${{ matrix.major }} python ./scripts/run_ci.py
      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-artifacts-blender-${{ matrix.major }}
          path: artifacts/
          if-no-files-found: ignore

