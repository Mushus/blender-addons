name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender-version: ["5.1"]
    steps:
      - uses: actions/checkout@v6
      - name: Build Blender Docker image
        run: docker build --build-arg BLENDER_MAJOR=${{ matrix.blender-version }} --build-arg BLENDER_VERSION=5.1.2 --tag blender-addon-tools:blender-${{ matrix.blender-version }} .
      - name: Run full CI suite in Docker
        run: docker run --rm --volume "${{ github.workspace }}:/workspace" --workdir /workspace blender-addon-tools:blender-${{ matrix.blender-version }} python ./scripts/run_ci.py
      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-artifacts-blender-${{ matrix.blender-version }}
          path: artifacts/
          if-no-files-found: ignore
