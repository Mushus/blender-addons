name: Draft Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Delete today's release, force-push tag to HEAD, recreate draft"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run: CI success commit. workflow_dispatch: selected branch tip.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # Needed for prepare_release.py --regenerate (git tag -f + push --force).
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Prepare Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.regenerate }}" = "true" ]; then
            python ./scripts/prepare_release.py --regenerate
          else
            python ./scripts/prepare_release.py
          fi
