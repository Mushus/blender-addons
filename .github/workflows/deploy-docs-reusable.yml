name: Build and Deploy Documentation Site

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Site fixes must not be pinned to an older release tag. Package
          # download metadata is generated from the published Releases API.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # pnpm 11+ uses pnpm/setup (successor to pnpm/action-setup).
      # pnpm 11 requires Node >= 22.13 (uses node:sqlite).
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Astro Starlight site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm site:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      # release イベントの GITHUB_SHA は tag のコミット。同じ SHA で再デプロイすると
      # Pages は success のまま旧 artifact を配信し続ける。
      # https://github.com/actions/deploy-pages/issues/383
      - name: Set unique pages build version
        run: |
          unique="$(printf '%s-%s-%s' '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ github.sha }}' | sha256sum | cut -c1-40)"
          echo "GITHUB_SHA=${unique}" >> "${GITHUB_ENV}"
          echo "pages_build_version=${unique}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
